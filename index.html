<!DOCTYPE html>
<html lang="en">
  <head>
     <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>constellations</title>
  </head>
  <body>
    <div class="constellations">


<section class="constellation-page">
<svg width="600" height="800" viewBox="0 0 800 800">
<g id="Andromeda" class="constellation" onclick="showInfo('andromeda', event)">
    <line x1="80" y1="120" x2="230" y2="250" />
    <line x1="230" y1="250" x2="300" y2="330" />
    <line x1="300" y1="330" x2="300" y2="400" />
    <line x1="300" y1="400" x2="200" y2="480" />
    <line x1="200" y1="480" x2="120" y2="510" />
    <line x1="300" y1="400" x2="390" y2="470" />
    <line x1="230" y1="250" x2="330" y2="280" />
    <line x1="330" y1="280" x2="300" y2="330" />
    <line x1="330" y1="280" x2="520" y2="180" />
    <line x1="520" y1="180" x2="520" y2="140" />
    <line x1="520" y1="140" x2="530" y2="120" />
    <line x1="520" y1="180" x2="580" y2="200" />
    <line x1="230" y1="250" x2="290" y2="220" />
    <line x1="290" y1="220" x2="330" y2="160" />
    <line x1="330" y1="160" x2="290" y2="50" />
    <line x1="290" y1="50" x2="190" y2="5" />
  
  <circle cx="80" cy="120" r="4.5"></circle>
  <circle cx="230" cy="250" r="4.5"></circle>
  <circle cx="300" cy="330" r="3"></circle>
  <circle cx="300" cy="400" r="1.5"></circle>
  <circle cx="200" cy="480" r="2"></circle>
  <circle cx="120" cy="510" r="2"></circle>
  <circle cx="390" cy="470" r="2"></circle>
  <circle cx="330" cy="280" r="1.5"></circle>
  <circle cx="520" cy="180" r="1.5"></circle>
  <circle cx="520" cy="140" r="1.5"></circle>
  <circle cx="530" cy="120" r="1.5"></circle>
  <circle cx="580" cy="200" r="1.5"></circle>
  <circle cx="290" cy="220" r="2.5"></circle>
  <circle cx="330" cy="160" r="2.5"></circle>
  <circle cx="290" cy="50" r="2.5"></circle>
  <circle cx="190" cy="5" r="4"></circle>
  </g>
</svg>
</section>

<section class="constellation-page">
<svg width="800" height="600" viewBox="0 0 800 600">
  <g id="Antlia" class="constellation"
     onclick="showInfo('antlia', event)">
    
    <line x1="30" y1="150" x2="290" y2="60" />
    <line x1="290" y1="60" x2="550" y2="50" />
    <line x1="550" y1="50" x2="600" y2="300" />
    <line x1="600" y1="300" x2="290" y2="60" />


    <circle cx="30" cy="150" r="3"></circle>
    <circle cx="290" cy="60" r="5"></circle>
    <circle cx="550" cy="50" r="5"></circle>
    <circle cx="600" cy="300" r="5"></circle>
  </g>
</svg>
</section>

<section class="constellation-page">
<svg width="800" height="600" viewBox="0 0 800 600">
  <g id="Apus" class="constellation"
     onclick="showInfo('apus', event)">
    
    <line x1="100" y1="200" x2="30" y2="80" />
    <line x1="30" y1="80" x2="200" y2="170" />
    <line x1="200" y1="170" x2="600" y2="240" />
    
    <circle cx="100" cy="200" r="3"></circle>
    <circle cx="30" cy="80" r="3"></circle>
    <circle cx="200" cy="170" r="3"></circle>
    <circle cx="600" cy="240" r="3"></circle>
  </g>
</svg>
</section>

<section class="constellation-page">
<svg width="800" height="600" viewBox="0 0 800 500">
  <g id="Cassiopeia" class="constellation"
     onclick="showInfo('cassiopeia', event)">
    
    <line x1="100" y1="10" x2="270" y2="130" />
    <line x1="270" y1="130" x2="400" y2="61" />
    <line x1="400" y1="61" x2="485" y2="205" />
    <line x1="485" y1="205" x2="650" y2="50" />


    <circle cx="100" cy="10" r="2"></circle>
    <circle cx="270" cy="130" r="3"></circle>
    <circle cx="400" cy="61" r="3"></circle>
    <circle cx="485" cy="205" r="4"></circle>
    <circle cx="650" cy="50" r="2.5"></circle>
  </g>
</svg>
</section>


<section class="constellation-page">
  <svg width="800" height="700" viewBox="0 0 800 700">
  <g id="orion" class="constellation" onclick="showInfo('orion', event)">
    <line x1="300" y1="10" x2="200" y2="160" />
    <line x1="300" y1="10" x2="400" y2="200" />
    <line x1="200" y1="160" x2="280" y2="360" />
    <line x1="280" y1="360" x2="330" y2="330" />
    <line x1="330" y1="330" x2="370" y2="300" />
    <line x1="400" y1="200" x2="370" y2="300" />
    <line x1="280" y1="360" x2="180" y2="600" />
    <line x1="370" y1="300" x2="480" y2="600" />

    <circle cx="300" cy="10" r="2" />
    <circle cx="200" cy="160" r="5" />
    <circle cx="400" cy="200" r="3" />
    <circle cx="280" cy="360" r="3" />
    <circle cx="330" cy="330" r="3" />
    <circle cx="370" cy="300" r="3" />
    <circle cx="180" cy="600" r="4" />
    <circle cx="480" cy="600" r="4" />
  </g>
</svg>
</section>

<section class="constellation-page">
<svg width="900" height="900" viewBox="0 0 900 900">
<g id="Pegasus" class="constellation" onclick="showInfo('pegasus', event)">

  <line x1="30" y1="300" x2="30" y2="600" />
  <line x1="30" y1="300" x2="330" y2="320" />
  <line x1="330" y1="320" x2="330" y2="570" />
  <line x1="330" y1="570" x2="30" y2="600" />
  <line x1="330" y1="570" x2="430" y2="620" />
  <line x1="430" y1="620" x2="600" y2="700" />
  <line x1="330" y1="570" x2="430" y2="480" />
  <line x1="430" y1="480" x2="460" y2="450" />
  <line x1="460" y1="450" x2="590" y2="495" />

    <circle cx="30" cy="300" r="10"/>
    <circle cx="30" cy="600" r="10"/>
    <circle cx="330" cy="320" r="10"/>
    <circle cx="330" cy="570" r="10"/>
    <circle cx="430" cy="620" r="6"/>
    <circle cx="600" cy="700" r="5"/>
    <circle cx="430" cy="480" r="7"/>
    <circle cx="460" cy="450" r="5"/>
    <circle cx="590" cy="495" r="6"/>
    <circle cx="690" cy="500" r="6"/>
    <circle cx="430" cy="250" r="6"/>
    <circle cx="560" cy="170" r="6"/>
    <circle cx="670" cy="250" r="6"/>
  </g>
</svg>
</section>

</div>
<div id="info-box" class="hidden">
  <h2 id="info-name"></h2>
  <p id="info-facts"></p>
</div>

<script src="script.js"></script>
  </body>
</html>
