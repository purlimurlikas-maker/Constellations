<!DOCTYPE html>
<html lang="en">
  <head>
     <link rel="stylesheet" href="style.css">
    <meta charset="utf-8" />
    <title>constellations</title>
  </head>
  <body>
    <svg width="400" height="300" viewBox="0 0 800 500">

  <g id="orion" class="constellation" onclick="showInfo('orion')">
    <line x1="400" y1="100" x2="350" y2="200" />
    <line x1="400" y1="100" x2="450" y2="200" />
    <line x1="350" y1="200" x2="370" y2="280" />
    <line x1="450" y1="200" x2="430" y2="280" />
    <line x1="370" y1="280" x2="400" y2="280" />
    <line x1="430" y1="280" x2="400" y2="280" />
    <line x1="370" y1="280" x2="320" y2="380" />
    <line x1="430" y1="280" x2="480" y2="380" />

    <circle cx="400" cy="100" r="4" />
    <circle cx="350" cy="200" r="3" />
    <circle cx="450" cy="200" r="3" />
    <circle cx="370" cy="280" r="3" />
    <circle cx="400" cy="280" r="3" />
    <circle cx="430" cy="280" r="3" />
    <circle cx="320" cy="380" r="4" />
    <circle cx="480" cy="380" r="4" />
  </g>
</svg>

<svg width="400" height="300" viewBox="0 0 800 500">

<g id="Cassipoeia" class="constellation" onclick="showInfo('cassipoeia')">
    <line x1="450" y1="50" x2="470" y2="70" />


    <circle cx="450" cy="50" r="2"></circle>
    <circle cx="470" cy="70" r="3"></circle>
  </g>
</svg>

<g id="orion" class="constellation" onclick="showInfo('orion', event)">

<div id="info-box" class="hidden">
  <h2 id="info-name"></h2>
  <p id="info-facts"></p>
</div>

<script src="script.js"></script>
  </body>
</html>
