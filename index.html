<!DOCTYPE html>
<html lang="en">
  <head>
     <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>constellations</title>
  </head>
  <body>
    <div class="constellations">

<section class="constellation-page">
  <svg width="800" height="500" viewBox="0 0 800 500">
  <g id="orion" class="constellation" onclick="showInfo('orion', event)">
    <line x1="400" y1="100" x2="350" y2="200" />
    <line x1="400" y1="100" x2="450" y2="200" />
    <line x1="350" y1="200" x2="370" y2="280" />
    <line x1="450" y1="200" x2="430" y2="260" />
    <line x1="370" y1="280" x2="400" y2="270" />
    <line x1="430" y1="260" x2="400" y2="270" />
    <line x1="370" y1="280" x2="320" y2="380" />
    <line x1="430" y1="260" x2="480" y2="380" />

    <circle cx="400" cy="100" r="4" />
    <circle cx="350" cy="200" r="3" />
    <circle cx="450" cy="200" r="3" />
    <circle cx="370" cy="280" r="3" />
    <circle cx="400" cy="270" r="3" />
    <circle cx="430" cy="260" r="3" />
    <circle cx="320" cy="380" r="4" />
    <circle cx="480" cy="380" r="4" />
  </g>
</svg>
</section>

<section class="constellation-page">
<svg class="cassiopeia-svg" width="800" height="500" viewBox="0 0 800 500">
  <g id="Cassiopeia" class="constellation"
     onclick="showInfo('cassiopeia', event)"
     transform="translate(0 300)">
    <rect x="420" y="20" width="150" height="100"
          fill="transparent" pointer-events="all" />
    
    <line x1="440" y1="50" x2="470" y2="70" />
    <line x1="470" y1="70" x2="500" y2="61" />
    <line x1="500" y1="61" x2="535" y2="85" />
    <line x1="535" y1="85" x2="550" y2="50" />


    <circle cx="440" cy="50" r="2"></circle>
    <circle cx="470" cy="70" r="3"></circle>
    <circle cx="500" cy="61" r="3"></circle>
    <circle cx="535" cy="85" r="4"></circle>
    <circle cx="550" cy="50" r="2.5"></circle>
  </g>
</svg>
</section>

<section class="constellation-page">
<svg width="600" height="500" viewBox="0 0 800 800">
<g id="Andromeda" class="constellation" onclick="showInfo('andromeda', event)">
    <line x1="570" y1="60" x2="630" y2="140" />
    <line x1="630" y1="140" x2="660" y2="170" />
    <line x1="660" y1="170" x2="660" y2="190" />
    <line x1="660" y1="190" x2="640" y2="220" />
    <line x1="640" y1="220" x2="620" y2="227" />
    <line x1="660" y1="190" x2="700" y2="210" />
    <line x1="660" y1="170" x2="670" y2="150" />
    <line x1="630" y1="140" x2="670" y2="150" />
    <line x1="630" y1="140" x2="650" y2="122" />
    <line x1="650" y1="122" x2="660" y2="110" />
    <line x1="660" y1="110" x2="660" y2="70" />
    <line x1="660" y1="70" x2="610" y2="20" />
    <line x1="670" y1="150" x2="760" y2="100" />
    <line x1="760" y1="100" x2="760" y2="85" />
    <line x1="760" y1="85" x2="767" y2="70" />
    <line x1="760" y1="100" x2="800" y2="107" />
  
  <circle cx="570" cy="60" r="4.5"></circle>
  <circle cx="630" cy="140" r="4.5"></circle>
  <circle cx="660" cy="170" r="3"></circle>
  <circle cx="660" cy="190" r="1.5"></circle>
  <circle cx="640" cy="220" r="2"></circle>
  <circle cx="620" cy="227" r="2"></circle>
  <circle cx="700" cy="210" r="2"></circle>
  <circle cx="670" cy="150" r="1.5"></circle>
  <circle cx="760" cy="100" r="1.5"></circle>
  <circle cx="760" cy="85" r="1.5"></circle>
  <circle cx="767" cy="70" r="1.5"></circle>
  <circle cx="800" cy="107" r="1.5"></circle>
  <circle cx="650" cy="122" r="2"></circle>
  <circle cx="660" cy="110" r="2"></circle>
  <circle cx="660" cy="70" r="2"></circle>
  <circle cx="610" cy="20" r="3"></circle>
  </g>
</svg>
</section>

<section class="constellation-page">
<svg width="500" height="300" viewBox="0 0 800 500">
<g id="Pegasus" class="constellation" onclick="showInfo('pegasus', event)">

    <circle cx="300" cy="10" r="6"/>
    <circle cx="300" cy="140" r="6"/>
  </g>
</svg>
</section>

</div>
<div id="info-box" class="hidden">
  <h2 id="info-name"></h2>
  <p id="info-facts"></p>
</div>

<script src="script.js"></script>
  </body>
</html>
